<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actions Library — Fatih Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&family=Josefin+Sans:wght@400;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script>(function(){var t=localStorage.getItem('fatih-lib-theme');document.documentElement.setAttribute('data-theme',['light','dark','medieval','fatih'].includes(t)?t:'light');})();</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

/* ─── FATIH ─── */
:root,
[data-theme="fatih"] {
  --bg: #0B1120; --bg-card: #162035; --bg-raised: #1C2840;
  --fg: #EDF1F5; --fg-muted: rgba(237,241,245,0.52); --fg-ghost: rgba(237,241,245,0.10);
  --accent: #3BBFCC; --accent-soft: rgba(59,191,204,0.10); --accent-border: rgba(59,191,204,0.20);
  --accent-glow: 0 0 16px rgba(59,191,204,0.18);
  --border: rgba(59,191,204,0.14); --border-soft: rgba(237,241,245,0.07);
  --shadow-card: 0 2px 12px rgba(0,0,0,0.35); --shadow-raised: 0 4px 24px rgba(0,0,0,0.5);
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-full: 9999px;
  --font-display: 'Josefin Sans', sans-serif; --font-body: 'DM Sans', sans-serif;
  --nav-bg: rgba(11,17,32,0.92); --eyebrow-color: var(--accent);
  --card-hover: rgba(59,191,204,0.40);
}

/* ─── LIGHT ─── */
[data-theme="light"] {
  --bg: #f9f8f4; --bg-card: #ffffff; --bg-raised: #f1f0eb;
  --fg: #1a1a18; --fg-muted: #8a8a80; --fg-ghost: rgba(26,26,24,0.08);
  --accent: #E8854A; --accent-soft: rgba(232,133,74,0.08); --accent-border: rgba(232,133,74,0.22);
  --accent-glow: none;
  --border: #e6e5de; --border-soft: #eeedea;
  --shadow-card: 0 2px 10px rgba(0,0,0,0.05); --shadow-raised: 0 4px 20px rgba(0,0,0,0.07);
  --r-sm: 8px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px; --r-full: 9999px;
  --font-display: 'Playfair Display', Georgia, serif; --font-body: 'DM Sans', system-ui, sans-serif;
  --nav-bg: rgba(249,248,244,0.92); --eyebrow-color: var(--accent);
  --card-hover: #E8854A;
}

/* ─── DARK ─── */
[data-theme="dark"] {
  --bg: #0E0F0D; --bg-card: #161713; --bg-raised: #1E2019;
  --fg: #F0EDE6; --fg-muted: #8A8A7E; --fg-ghost: rgba(240,237,230,0.06);
  --accent: #C9A84C; --accent-soft: rgba(201,168,76,0.08); --accent-border: rgba(201,168,76,0.22);
  --accent-glow: none;
  --border: #2A2B27; --border-soft: #242520;
  --shadow-card: 0 2px 10px rgba(0,0,0,0.4); --shadow-raised: 0 4px 24px rgba(0,0,0,0.55);
  --r-sm: 8px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px; --r-full: 9999px;
  --font-display: 'Playfair Display', Georgia, serif; --font-body: 'DM Sans', system-ui, sans-serif;
  --nav-bg: rgba(14,15,13,0.95); --eyebrow-color: #7A8C72;
  --card-hover: var(--accent);
}

/* ─── MEDIEVAL ─── */
[data-theme="medieval"] {
  --bg: #0E0F0D; --bg-card: #161713; --bg-raised: #1E2019;
  --fg: #F0EDE6; --fg-muted: #8A8A7E; --fg-ghost: rgba(240,237,230,0.06);
  --accent: #C9A84C; --accent-soft: rgba(201,168,76,0.08); --accent-border: rgba(201,168,76,0.22);
  --accent-glow: none;
  --border: #2A2B27; --border-soft: #242520;
  --shadow-card: 0 2px 10px rgba(0,0,0,0.4); --shadow-raised: 0 4px 24px rgba(0,0,0,0.55);
  --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 10px; --r-full: 9999px;
  --font-display: 'Cormorant Garamond', Georgia, serif; --font-body: 'Inter', system-ui, sans-serif;
  --nav-bg: rgba(14,15,13,0.95); --eyebrow-color: #7A8C72;
  --card-hover: var(--accent);
}

/* ─── BASE ─── */
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.65;
  overflow-x: hidden; -webkit-font-smoothing: antialiased;
  transition: background 0.3s ease, color 0.3s ease;
}

/* ─── NAV ─── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 48px; height: 60px;
  background: var(--nav-bg); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-soft);
}
.nav-back {
  display: flex; align-items: center; gap: 8px;
  text-decoration: none; color: var(--fg-muted);
  font-size: 13px; font-weight: 500; transition: color 0.2s; flex-shrink: 0;
}
.nav-back:hover { color: var(--fg); }
.nav-back svg { width: 14px; height: 14px; stroke-width: 2; }
.nav-back-logo { width: 24px; height: 24px; border-radius: 5px; overflow: hidden; flex-shrink: 0; }
.nav-back-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.nav-back-logo .logo-light { display: none; }
[data-theme="light"] .nav-back-logo .logo-dark { display: none; }
[data-theme="light"] .nav-back-logo .logo-light { display: block; }

.nav-title {
  position: absolute; left: 50%; transform: translateX(-50%);
  font-family: var(--font-display); font-size: 15px; font-weight: 500;
  color: var(--fg); white-space: nowrap;
}
[data-theme="fatih"] .nav-title { font-weight: 600; letter-spacing: 0.06em; font-size: 14px; }
[data-theme="medieval"] .nav-title { font-weight: 300; letter-spacing: 0.08em; }

.nav-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.theme-toggle {
  display: flex; gap: 2px;
  background: var(--bg-raised); border: 1px solid var(--border-soft);
  border-radius: var(--r-full); padding: 3px;
}
.theme-toggle button {
  background: transparent; border: none; cursor: pointer;
  padding: 5px 10px; border-radius: var(--r-full);
  font-family: var(--font-body); font-size: 11px; font-weight: 500;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--fg-muted); transition: background 0.18s ease, color 0.18s ease;
  white-space: nowrap;
}
.theme-toggle button.active { background: var(--accent); color: var(--bg); }
[data-theme="dark"] .theme-toggle button.active,
[data-theme="medieval"] .theme-toggle button.active { color: #0E0F0D; }

/* ─── HERO ─── */
.hero {
  padding: 130px 24px 64px; text-align: center;
  position: relative; overflow: hidden;
}
.hero-orb {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 700px; height: 350px; border-radius: 50%; pointer-events: none; opacity: 0.5;
}
[data-theme="fatih"] .hero-orb { background: radial-gradient(ellipse at center, rgba(59,191,204,0.08) 0%, transparent 65%); }
[data-theme="light"] .hero-orb { background: radial-gradient(ellipse at center, rgba(232,133,74,0.08) 0%, rgba(212,96,122,0.04) 50%, transparent 70%); }
[data-theme="dark"] .hero-orb,
[data-theme="medieval"] .hero-orb { background: radial-gradient(ellipse at center, rgba(201,168,76,0.05) 0%, transparent 65%); }

.hero-eyebrow {
  font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--eyebrow-color); margin-bottom: 16px; font-weight: 500; display: block;
}
.hero h1 {
  font-family: var(--font-display);
  font-size: clamp(36px, 6vw, 60px);
  font-weight: 600; line-height: 1.1; color: var(--fg);
  margin-bottom: 14px;
}
[data-theme="light"] .hero h1,
[data-theme="dark"] .hero h1 { font-weight: 500; }
[data-theme="medieval"] .hero h1 { font-weight: 300; }
.hero-sub {
  font-size: 15px; color: var(--fg-muted); max-width: 440px;
  margin: 0 auto; line-height: 1.75;
}

/* ─── CONTROLS ─── */
.controls-wrap {
  max-width: 1080px; margin: 0 auto;
  padding: 0 32px 32px;
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
}
.search-input {
  flex: 1; min-width: 200px; max-width: 340px;
  background: var(--bg-card); border: 1px solid var(--border-soft);
  border-radius: var(--r-full); padding: 10px 18px;
  font-family: var(--font-body); font-size: 13px; color: var(--fg);
  outline: none; transition: border-color 0.2s;
}
.search-input::placeholder { color: var(--fg-muted); }
.search-input:focus { border-color: var(--accent); }
.tag-filters { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-btn {
  background: var(--bg-raised); border: 1px solid var(--border-soft);
  border-radius: var(--r-full); padding: 6px 14px;
  font-family: var(--font-body); font-size: 12px; font-weight: 500;
  color: var(--fg-muted); cursor: pointer; transition: all 0.18s ease;
}
.tag-btn:hover { border-color: var(--accent); color: var(--fg); }
.tag-btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }
[data-theme="dark"] .tag-btn.active,
[data-theme="medieval"] .tag-btn.active { color: #0E0F0D; }

/* ─── GRID ─── */
.actions-grid {
  max-width: 1080px; margin: 0 auto;
  padding: 0 32px 100px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}
.action-card {
  background: var(--bg-card); border: 1px solid var(--border-soft);
  border-radius: var(--r-lg); padding: 24px 22px 20px;
  box-shadow: var(--shadow-card);
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  display: flex; flex-direction: column; gap: 14px;
}
.action-card:hover {
  transform: translateY(-2px);
  border-color: var(--card-hover);
  box-shadow: var(--shadow-raised);
}
[data-theme="fatih"] .action-card:hover { box-shadow: var(--shadow-raised), var(--accent-glow); }

.action-icon {
  width: 40px; height: 40px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-soft); border: 1px solid var(--accent-border);
  border-radius: var(--r-md); color: var(--accent);
}
.action-icon svg { width: 20px; height: 20px; stroke-width: 1.75; }

.action-title {
  font-family: var(--font-display); font-size: 16px; font-weight: 600;
  color: var(--fg); line-height: 1.3;
}
[data-theme="light"] .action-title,
[data-theme="dark"] .action-title { font-weight: 500; }
[data-theme="medieval"] .action-title { font-weight: 400; letter-spacing: 0.01em; }

.action-desc { font-size: 13px; color: var(--fg-muted); line-height: 1.65; }

.action-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: auto; padding-top: 4px;
}
.action-source {
  font-size: 11px; color: var(--fg-muted); letter-spacing: 0.04em;
}
.action-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.action-tag {
  font-size: 10px; font-weight: 600; letter-spacing: 0.10em; text-transform: uppercase;
  border-radius: var(--r-full); padding: 2px 8px; border: 1px solid;
}
.action-tag.faith { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-border); }
.action-tag.mind  { color: var(--eyebrow-color); background: var(--fg-ghost); border-color: var(--border-soft); }
.action-tag.daily { color: var(--fg-muted); background: var(--bg-raised); border-color: var(--border-soft); }
.action-tag.onetime { color: var(--fg-muted); background: var(--bg-raised); border-color: var(--border-soft); }

.no-results {
  grid-column: 1 / -1; text-align: center; padding: 64px 24px;
  color: var(--fg-muted); font-size: 14px;
}

/* ─── FOOTER ─── */
footer {
  border-top: 1px solid var(--border-soft); padding: 28px 48px;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 12px;
}
.footer-name { font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--fg-muted); letter-spacing: 0.06em; }
.footer-credit { font-size: 11px; color: var(--fg-muted); letter-spacing: 0.04em; }
.footer-credit a { color: var(--accent); text-decoration: none; }
.footer-credit a:hover { text-decoration: underline; }

/* ─── FADE IN ─── */
.fade-in { opacity: 0; transform: translateY(12px); transition: opacity 0.5s ease, transform 0.5s ease; }
.fade-in.visible { opacity: 1; transform: none; }

/* ─── RESPONSIVE ─── */
@media (max-width: 640px) {
  nav { padding: 0 16px; }
  .nav-title { display: none; }
  .theme-toggle button { padding: 5px 8px; font-size: 10px; }
  .hero { padding: 100px 20px 48px; }
  .controls-wrap { padding: 0 16px 24px; }
  .search-input { max-width: 100%; }
  .actions-grid { padding: 0 16px 80px; grid-template-columns: 1fr; }
  footer { padding: 20px 16px; flex-direction: column; text-align: center; }
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-back" href="../">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 12H5M12 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="nav-back-logo">
      <img class="logo-dark" src="../assets/logo-app-icon.png" alt="Fatih">
      <img class="logo-light" src="../assets/logo-concept.png" alt="Fatih">
    </div>
    Library
  </a>
  <div class="nav-title">Actions Library</div>
  <div class="nav-right">
    <div class="theme-toggle">
      <button data-theme-btn="light">Light</button>
      <button data-theme-btn="dark">Dark</button>
      <button data-theme-btn="medieval">Medieval</button>
      <button data-theme-btn="fatih">Fatih</button>
    </div>
  </div>
</nav>

<!-- HERO -->
<div class="hero fade-in">
  <div class="hero-orb"></div>
  <span class="hero-eyebrow">Things worth doing</span>
  <h1>Actions Library</h1>
  <p class="hero-sub">Practical steps distilled from every lesson. Pick one. Do it today. More added with each new guide.</p>
</div>

<!-- CONTROLS -->
<div class="controls-wrap fade-in">
  <input class="search-input" type="search" placeholder="Search actions..." id="action-search">
  <div class="tag-filters">
    <button class="tag-btn active" data-filter="all">All</button>
    <button class="tag-btn" data-filter="faith">Faith</button>
    <button class="tag-btn" data-filter="mind">Mind</button>
    <button class="tag-btn" data-filter="daily">Daily</button>
    <button class="tag-btn" data-filter="onetime">One-time</button>
  </div>
</div>

<!-- GRID -->
<div class="actions-grid" id="actions-grid"></div>

<!-- FOOTER -->
<footer>
  <div class="footer-name">Fatih Library</div>
  <div class="footer-credit">Built on the <a href="#">Fatih Design System</a></div>
</footer>

<script src="../assets/theme.js"></script>
<script>
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.08 });
document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

const ACTIONS = [
  {
    id: 'dua-names',
    title: 'Call on Allah by His Names in your dua',
    desc: 'Match the name to the need. Al-Razzaq for provision. Al-Fattah when a door is closed. Al-Maalik when you need to remember who owns what you are asking for.',
    tags: ['faith', 'daily'],
    source: 'Gratitude',
    icon: `<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke-linecap="round" stroke-linejoin="round"/>`
  },
  {
    id: 'tawakkul-win',
    title: 'Write down one Tawakkul win today',
    desc: 'A moment you trusted Allah and He came through. Big or small. Write it before you sleep. You will forget otherwise, and you need a record for when doubt sets in.',
    tags: ['faith', 'daily'],
    source: 'Gratitude',
    icon: `<path d="M12 20h9" stroke-linecap="round"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke-linecap="round" stroke-linejoin="round"/>`
  },
  {
    id: 'charity',
    title: 'Give £1 in charity today',
    desc: 'The amount is not the point. The consistency is. A closed hand cannot receive. Make it a daily non-negotiable and watch what opens.',
    tags: ['faith', 'daily'],
    source: 'Gratitude',
    icon: `<circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11" stroke-linecap="round" stroke-linejoin="round"/>`
  },
  {
    id: 'blessing-eyes',
    title: 'Pick one blessing and really look at it',
    desc: 'Something you pass by without noticing. Sit with it for 60 seconds. Gratitude is not a feeling you wait for. It is a discipline you build.',
    tags: ['faith', 'mind', 'daily'],
    source: 'Gratitude',
    icon: `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/>`
  },
  {
    id: 'single-tab',
    title: 'Work your next session with one tab open',
    desc: 'Not a rule forever. Just for the next session. One tab. See what your focus feels like without the escape hatch of another window waiting.',
    tags: ['mind', 'daily'],
    source: 'Overstimulation',
    icon: `<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21" stroke-linecap="round"/><line x1="12" y1="17" x2="12" y2="21" stroke-linecap="round"/>`
  },
  {
    id: 'morning-silence',
    title: 'Keep the first 30 minutes phone-free',
    desc: 'Before any input reaches you. No notification, no feed, no content. Let the first direction of your attention be yours, not theirs.',
    tags: ['mind', 'daily'],
    source: 'Overstimulation',
    icon: `<line x1="1" y1="1" x2="23" y2="23" stroke-linecap="round"/><path d="M10.68 10.68a2 2 0 0 0 2.64 2.64" stroke-linecap="round"/><path d="M6.09 6.09A9.95 9.95 0 0 0 1 12s4 8 11 8a9.95 9.95 0 0 0 5.39-1.57" stroke-linecap="round"/><path d="M22.83 12.23A9.95 9.95 0 0 0 23 12s-4-8-11-8c-.74 0-1.47.07-2.17.2" stroke-linecap="round"/>`
  },
  {
    id: 'name-feeling',
    title: 'Name the emotion before you react',
    desc: 'When something fires off inside you, pause. Say it: "I am anxious." "I am frustrated." Naming reduces intensity. It gives you a second before you act on it.',
    tags: ['mind', 'daily'],
    source: 'Overstimulation',
    icon: `<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke-linecap="round" stroke-linejoin="round"/>`
  },
  {
    id: 'three-tasks',
    title: 'Write your 3 most important tasks before bed',
    desc: 'Three. Not ten. Three things that, if completed tomorrow, would make the day a win. Write them tonight so tomorrow starts with clarity, not chaos.',
    tags: ['mind', 'daily'],
    source: 'Productivity',
    icon: `<line x1="8" y1="6" x2="21" y2="6" stroke-linecap="round"/><line x1="8" y1="12" x2="21" y2="12" stroke-linecap="round"/><line x1="8" y1="18" x2="21" y2="18" stroke-linecap="round"/><line x1="3" y1="6" x2="3.01" y2="6" stroke-linecap="round"/><line x1="3" y1="12" x2="3.01" y2="12" stroke-linecap="round"/><line x1="3" y1="18" x2="3.01" y2="18" stroke-linecap="round"/>`
  }
];

function renderActions(list) {
  const grid = document.getElementById('actions-grid');
  if (!list.length) {
    grid.innerHTML = '<p class="no-results">No actions found.</p>';
    return;
  }
  grid.innerHTML = list.map(a => `
    <div class="action-card">
      <div class="action-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">${a.icon}</svg>
      </div>
      <div class="action-title">${a.title}</div>
      <div class="action-desc">${a.desc}</div>
      <div class="action-footer">
        <span class="action-source">${a.source}</span>
        <div class="action-tags">${a.tags.map(t => `<span class="action-tag ${t}">${t}</span>`).join('')}</div>
      </div>
    </div>
  `).join('');
}

function filterActions() {
  const query = document.getElementById('action-search').value.toLowerCase();
  const active = document.querySelector('.tag-btn.active').dataset.filter;
  const filtered = ACTIONS.filter(a => {
    const matchTag = active === 'all' || a.tags.includes(active);
    const matchQuery = !query || a.title.toLowerCase().includes(query) || a.desc.toLowerCase().includes(query);
    return matchTag && matchQuery;
  });
  renderActions(filtered);
}

document.getElementById('action-search').addEventListener('input', filterActions);
document.querySelectorAll('.tag-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    filterActions();
  });
});

renderActions(ACTIONS);
</script>
</body>
</html>
